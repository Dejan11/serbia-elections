<!DOCTYPE html>
<html lang="sr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Izbori Srbija — mapa po opštinama</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
  :root{
    --bg:#0e1116;
    --card:#161b22;
    --border:#2a3038;
    --accent:#c0143c;
    --accent2:#2e7dd7;
    --text:#e8eaed;
    --muted:#9aa4af;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0; padding:0; height:100%;
    background:var(--bg); color:var(--text);
    font-family:-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;
  }
  #controls{
    padding:10px 10px 6px 10px;
    background:var(--card);
    border-bottom:1px solid var(--border);
  }
  h1{
    font-size:1.05rem;
    margin:0 0 8px 0;
    color:#fff;
  }
  h1 span{color:var(--accent);}
  select{
    width:100%;
    padding:10px;
    margin-bottom:6px;
    border-radius:8px;
    border:1px solid var(--border);
    background:#0b0e13;
    color:var(--text);
    font-size:.92rem;
  }
  #status{
    font-size:.78rem;
    color:var(--muted);
    min-height:1.1em;
  }
  #status.err{color:#ff6b6b;}
  #status.ok{color:#4dd48a;}
  #map{
    position:absolute;
    top:0; left:0; right:0; bottom:0;
  }
  #mapwrap{
    position:relative;
    height:calc(100vh - 150px);
    min-height:320px;
  }
  .legend{
    background:rgba(22,27,34,0.92);
    border:1px solid var(--border);
    border-radius:8px;
    padding:8px 10px;
    font-size:.75rem;
    color:var(--text);
    line-height:1.5;
  }
  .legend i{
    width:14px; height:14px;
    display:inline-block;
    margin-right:6px;
    border-radius:2px;
    vertical-align:middle;
  }
  .leaflet-tooltip.muni-tip{
    background:var(--card);
    border:1px solid var(--border);
    color:var(--text);
    font-size:.8rem;
    padding:6px 8px;
  }
  .leaflet-popup-content-wrapper, .leaflet-popup-tip{
    background:var(--card);
    color:var(--text);
  }
</style>
</head>
<body>

<div id="controls">
  <h1>Izbori <span>Srbija</span> — po opštinama</h1>
  <select id="datasetSelect"></select>
  <select id="candidateSelect"></select>
  <div id="status">Učitavam...</div>
</div>

<div id="mapwrap"><div id="map"></div></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
// ---- Izvori (menjaj samo ovaj blok ako dodaješ nove godine) ----
const REPO = 'https://raw.githubusercontent.com/Dejan11/serbia-elections/refs/heads/main/';
const GEOM_URL = REPO + 'Opstina_simplified.geojson';
const YEARS = [
  {code:'2000', label:'Parlamentarni izbori 2000'},
  {code:'2003', label:'Parlamentarni izbori 2003'},
  {code:'2007', label:'Parlamentarni izbori 2007'},
  {code:'2008', label:'Parlamentarni izbori 2008'},
  {code:'2012', label:'Parlamentarni izbori 2012'},
  {code:'2014', label:'Parlamentarni izbori 2014'},
  {code:'2016', label:'Parlamentarni izbori 2016'},
  {code:'2020', label:'Parlamentarni izbori 2020'}
];
function electionUrl(code){ return REPO + `election_${code}_muni.json`; }

let geomData = null;
let electionData = null;   // {year, label, municipalities: {mb: {n, t, c:{cand:votes}}}}
let geoLayer = null;
let legendControl = null;

const map = L.map('map', {zoomControl:true}).setView([44.2, 20.9], 7);
L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
  attribution: '&copy; OpenStreetMap &copy; CARTO',
  maxZoom: 13
}).addTo(map);

function setStatus(msg, cls){
  const s = document.getElementById('status');
  s.textContent = msg;
  s.className = cls || '';
}

function populateDatasetSelect(){
  const sel = document.getElementById('datasetSelect');
  sel.innerHTML = '';
  YEARS.forEach(y => {
    const opt = document.createElement('option');
    opt.value = y.code;
    opt.textContent = y.label;
    sel.appendChild(opt);
  });
  sel.value = '2020';
  sel.addEventListener('change', loadElection);
}

async function loadGeometry(){
  const res = await fetch(GEOM_URL);
  if(!res.ok) throw new Error('Granice opština: HTTP ' + res.status);
  geomData = await res.json();
}

async function loadElection(){
  document.getElementById('candidateSelect').innerHTML = '';
  const code = document.getElementById('datasetSelect').value;
  setStatus('Učitavam rezultate...', '');
  try{
    const res = await fetch(electionUrl(code));
    if(!res.ok) throw new Error('HTTP ' + res.status);
    const json = await res.json();
    electionData = json;
    setStatus(`Učitano: ${Object.keys(json.municipalities).length} opština.`, 'ok');
    populateCandidateSelect();
  }catch(err){
    setStatus('Greška: ' + err.message, 'err');
  }
}

function populateCandidateSelect(){
  // saberi glasove po kandidatu na nivou cele zemlje da bismo sortirali listu
  const totals = {};
  let grandTotal = 0;
  Object.values(electionData.municipalities).forEach(m => {
    grandTotal += m.t;
    Object.entries(m.c).forEach(([cand, v]) => {
      totals[cand] = (totals[cand]||0) + v;
    });
  });
  const list = Object.entries(totals)
    .map(([name, v]) => ({name, v, pct: grandTotal ? (v/grandTotal*100) : 0}))
    .sort((a,b) => b.v - a.v);

  const sel = document.getElementById('candidateSelect');
  sel.innerHTML = '';
  list.forEach(c => {
    const opt = document.createElement('option');
    opt.value = c.name;
    opt.textContent = `${c.name} (${c.pct.toFixed(1)}% Srbija)`;
    sel.appendChild(opt);
  });
  sel.addEventListener('change', drawMap);
  drawMap();
}

function colorFor(pct, min, max){
  if(pct === undefined || pct === null || isNaN(pct)) return '#333';
  const t = max > min ? (pct - min) / (max - min) : 0.5;
  const c1 = [46,125,215];
  const c2 = [192,20,60];
  const r = Math.round(c1[0] + (c2[0]-c1[0])*t);
  const g = Math.round(c1[1] + (c2[1]-c1[1])*t);
  const b = Math.round(c1[2] + (c2[2]-c1[2])*t);
  return `rgb(${r},${g},${b})`;
}

function drawMap(){
  const candidate = document.getElementById('candidateSelect').value;
  if(!candidate || !geomData || !electionData) return;

  // izračunaj % po opštini za izabranog kandidata
  const muniPct = {};
  const muniVotes = {};
  Object.entries(electionData.municipalities).forEach(([mb, m]) => {
    const v = m.c[candidate];
    if(v !== undefined && m.t > 0){
      muniPct[mb] = v / m.t * 100;
      muniVotes[mb] = v;
    }
  });
  const pctVals = Object.values(muniPct);
  const min = Math.min(...pctVals);
  const max = Math.max(...pctVals);

  if(geoLayer) map.removeLayer(geoLayer);

  geoLayer = L.geoJSON(geomData, {
    style: feature => {
      const mb = String(feature.properties.mb);
      const pct = muniPct[mb];
      return {
        fillColor: pct !== undefined ? colorFor(pct, min, max) : '#333',
        fillOpacity: 0.85,
        color: '#0e1116',
        weight: 0.6
      };
    },
    onEachFeature: (feature, layer) => {
      const mb = String(feature.properties.mb);
      const pct = muniPct[mb];
      const votes = muniVotes[mb];
      const naziv = feature.properties.ime;
      const tip = pct !== undefined
        ? `<b>${naziv}</b><br>${candidate}<br><b>${pct.toFixed(2)}%</b> (${votes.toLocaleString('sr-RS')} glasova)`
        : `<b>${naziv}</b><br>nema podataka`;
      layer.bindTooltip(tip, {className:'muni-tip', sticky:true});
    }
  }).addTo(map);

  if(legendControl) map.removeControl(legendControl);
  legendControl = L.control({position:'bottomright'});
  legendControl.onAdd = function(){
    const div = L.DomUtil.create('div', 'legend');
    div.innerHTML = `
      <div><i style="background:${colorFor(min,min,max)}"></i>${min.toFixed(1)}%</div>
      <div><i style="background:${colorFor((min+max)/2,min,max)}"></i>${((min+max)/2).toFixed(1)}%</div>
      <div><i style="background:${colorFor(max,min,max)}"></i>${max.toFixed(1)}%</div>
      <div style="margin-top:4px; color:var(--muted)">boja = % po opštini (relativna skala)</div>
    `;
    return div;
  };
  legendControl.addTo(map);
}

(async function init(){
  populateDatasetSelect();
  try{
    await loadGeometry();
    await loadElection();
  }catch(err){
    setStatus('Greška: ' + err.message, 'err');
  }
})();
</script>

</body>
</html>
